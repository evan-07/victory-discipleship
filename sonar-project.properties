# SonarQube Project Configuration
sonar.projectKey=evan-07_victory-discipleship
sonar.organization=evan-07

# Project metadata
sonar.projectName=Victory Discipleship Member Management System
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend,frontend
sonar.tests=backend/tests

# Exclusions
sonar.exclusions=**/tests/**,**/__pycache__/**,**/node_modules/**,**/.venv/**,**/venv/**
sonar.test.exclusions=**/tests/**

# Language-specific settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
