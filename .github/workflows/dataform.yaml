name: Dataform Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

permissions:
  contents: read
  id-token: write

jobs:
  compile:
    name: Compile Dataform
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli@3.0.46

      # Workaround: Remove package.json to prevent "unexpected package.json" error
      # Dataform tries to compile it as a source file if present, but this workflow uses global CLI.
      # - name: Remove package.json (Workaround)
      #   run: rm package.json package-lock.json
      #   working-directory: ./data

      - name: Compile Dataform
        run: dataform compile
        working-directory: ./data

  run:
    name: Run Dataform (Production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli@3.0.46


      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Create Dataform Config
        run: |
          jq -n \
            --arg projectId "${{ secrets.GCP_PROJECT_ID }}" \
            --arg location "${{ secrets.GCP_LOCATION }}" \
            '{"projectId": $projectId, "location": $location}' > dataform-config.json

      # Workaround: Remove package.json to prevent "unexpected package.json" error
      # Dataform tries to compile it as a source file if present, but this workflow uses global CLI.
      - name: Remove package.json (Workaround)
        run: rm package.json package-lock.json
        working-directory: ./data

      - name: Run Dataform
        working-directory: ./data
        run: dataform run --credentials ../dataform-config.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
