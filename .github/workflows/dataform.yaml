name: Dataform Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

permissions:
  contents: read
  id-token: write

jobs:
  compile:
    name: Compile Dataform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli

      - name: Compile Dataform
        run: dataform compile
        working-directory: ./data

  run:
    name: Run Dataform (Production)
    if: github.ref == 'refs/heads/main'
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli

      - name: Debug Secrets
        run: |
          echo "WIF_PROVIDER is set: ${{ secrets.WIF_PROVIDER != '' }}"
          echo "WIF_SERVICE_ACCOUNT is set: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Run Dataform
        working-directory: ./data
        run: dataform run
