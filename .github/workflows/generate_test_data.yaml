name: Generate Test Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

permissions:
  contents: read
  id-token: write

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tests/data_generator/requirements.txt ]; then pip install -r tests/data_generator/requirements.txt; fi

      - name: Generate Test Data
        run: python tests/data_generator/generate_test_data.py

      - name: Upload Test Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-cases
          path: test_cases.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Convert to NDJSON
        run: jq -c '.[]' test_cases.json > test_cases.ndjson

      - name: Load to BigQuery
        run: |
          bq load \
            --source_format=NEWLINE_DELIMITED_JSON \
            victory-discipleship:bronze_dataset.raw_members \
            test_cases.ndjson \
            ingestion_timestamp:TIMESTAMP,payload:JSON,metadata:JSON

      - name: Verify Load
        run: |
          bq query --nouse_legacy_sql \
          'SELECT count(*) as count FROM `victory-discipleship.bronze_dataset.raw_members`'
